data:
  start: '2015-01-01'
  end: '2026-01-01'
  train_end: '2022-01-01'
  val_end: '2024-01-01'
  data_path: unused-per-stock-dataloader-adapter
  lookback_window: 90
  predict_window: 10
  max_context: 512
  clip: 5.0
training:
  tokenizer_epochs: 3
  basemodel_epochs: 5
  batch_size: 16
  num_workers: 0
  log_interval: 50
  seed: 42
  tokenizer_learning_rate: 0.0001
  predictor_learning_rate: 0.00001
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_weight_decay: 0.1
  accumulation_steps: 1
model_paths:
  pretrained_tokenizer: NeoQuasar/Kronos-Tokenizer-base
  pretrained_predictor: NeoQuasar/Kronos-small
  exp_name: sp500
  base_path: outputs
  base_save_path: ''
  finetuned_tokenizer: ''
experiment:
  train_tokenizer: true
  train_basemodel: true
  use_comet: false
device:
  use_cuda: true
  device_id: 0